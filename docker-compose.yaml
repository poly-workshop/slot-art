services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro

volumes:
  redis-data:
