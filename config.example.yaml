server:
  addr: ":8080"
  read_timeout: "30s"
  write_timeout: "60s"
  idle_timeout: "120s"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5

asynq:
  redis_addr: "localhost:6379"
  redis_password: ""
  concurrency: 4
  queues:
    critical: 6
    default: 4

admin:
  token: "${ADMIN_TOKEN}"

openai_image2:
  api_key: "${OPENAI_API_KEY}"
  endpoint: "https://api.openai.com"
  model: "${OPENAI_IMAGE2_MODEL}"
  default_size: "1024x1024"
  max_images: 4
  supports_references: false

result_ttl: "2h"
refimg_ttl: "30m"
credit_ttl: "168h"
task_ttl: "24h"
session_ttl: "720h"

log:
  level: "info"
  format: "text"
